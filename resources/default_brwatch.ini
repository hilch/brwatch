;
; INI- File for BRWATCH.EXE
;

; ----------------------------------------------------------
; PVI- Remote = remote control PVI from second PC
;
; for documentation see PviInitialize(),
; https://help.br-automation.com/#/en/6/automationnet%2Fpvibase%2Fcore%2Fpvifuncinitialize.htm
; ----------------------------------------------------------
[REMOTE]
;parameter = COMT=10 AS=1 PT=20 IP=192.168.150.100 (remote pvi)

; ----------------------------------------------------------
; ANSL CPU
; https://help.br-automation.com/#/en/6/automationnet/pvibase/lines/lnansl/pvilnanslcpu.htm
; ----------------------------------------------------------
; enter next CPU here...


[General]
WriteAllowed = 1
PLCDataChangeEvents=0
; Process variable refresh time in milliseconds.
object_refresh_time=50

[Logger]
LoggerActive=0
; Filename defaults to logger.csv in the user's home folder.
maxfilesize=50
cycletime=1000
zip=0
write_by_change=0
